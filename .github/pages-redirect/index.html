        <title>Redirecting to itsmaninder-singh.github.io...</title>
        <link rel="canonical" href="https://itsmaninder-singh.github.io/" />
        <script>
            (function () {
                var destinationOrigin = 'https://itsmaninder-singh.github.io';

                if (window.location.origin !== destinationOrigin) {
                    window.location.replace(

                            window.location.search +

                }
            })();
        </script>
